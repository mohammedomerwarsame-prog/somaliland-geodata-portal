{% extends "base.html" %}
{% block title %}Change password · {{ PORTAL_NAME }}{% endblock %}
{% block content %}
<div class="container auth-wrap">
  <form class="panel form auth-card" method="post" novalidate>{% csrf_token %}
    <h1>Change password</h1>
    {% for field in form %}{% include "datasets/_field.html" %}{% endfor %}
    <button class="btn btn-navy block big" type="submit">Update password</button>
  </form>
</div>
{% endblock %}

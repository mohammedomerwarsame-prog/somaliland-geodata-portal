{% extends "base.html" %}
{% block title %}Log in · {{ PORTAL_NAME }}{% endblock %}
{% block content %}
<div class="container auth-wrap">
  <form class="panel form auth-card" method="post">{% csrf_token %}
    <h1>Log in</h1>
    {% if form.errors %}<div class="alert alert-error">Username or password is incorrect.</div>{% endif %}
    <div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-navy block big" type="submit"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
    <p class="small center">No account? <a href="{% url 'accounts:signup' %}">Register</a></p>
  </form>
</div>
{% endblock %}

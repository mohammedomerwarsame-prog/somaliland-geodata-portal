# Nginx site for the Somaliland GeoData Portal.
# setup_server.sh replaces __DOMAIN__, __APP_DIR__ and __DATA_DIR__.
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Large GIS uploads (keep in step with MAX_UPLOAD_MB)
    client_max_body_size 2100M;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /static/ {
        alias __APP_DIR__/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Public media only (thumbnails, logos). Dataset files live in
    # __DATA_DIR__/private_media and are NEVER served directly.
    location /media/ {
        alias __DATA_DIR__/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
